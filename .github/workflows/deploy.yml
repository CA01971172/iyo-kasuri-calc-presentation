name: Deploy Slidev to GitHub Pages

on:
  push:
    branches: [ main ] # メインブランチにプッシュされた時に実行

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20' # 使用するNode.jsのバージョン

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build -- --base /iyo-kasuri-calc-presentation/

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist # Slidevのビルド出力先
